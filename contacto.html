<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — MandarCasa</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>tailwind.config = {theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
</head>
<body class="bg-[#07101f] text-white font-sans">

  <nav class="sticky top-0 z-50 bg-[#07101f]/95 backdrop-blur-xl border-b border-[#1e3050]">
    <div class="max-w-screen-xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-[#2563eb] rounded-lg flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z"/><path d="M9 22V12H15V22"/></svg>
        </div>
        <span class="font-black text-2xl tracking-tighter">Mandar<span class="text-[#2563eb]">Casa</span></span>
      </a>
      <div class="flex items-center gap-2">
        <div class="flex items-center bg-[#0d1a2e] border border-[#1e3050] rounded-full p-1 text-xs">
          <button onclick="switchLanguage('es')" id="lang-es-btn" class="px-3 py-1 rounded-full bg-[#2563eb] text-white font-medium">ES</button>
          <button onclick="switchLanguage('en')" id="lang-en-btn" class="px-3 py-1 rounded-full text-white/70 hover:text-white">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-screen-xl mx-auto px-6 pt-16 pb-20">
    <div class="text-center max-w-md mx-auto mb-12">
      <div class="font-extrabold tracking-[3px] text-xs text-[#3b82f6] lang-es">HABLEMOS</div>
      <div class="font-extrabold tracking-[3px] text-xs text-[#3b82f6] lang-en hidden">LET'S TALK</div>
      <h1 class="font-black tracking-tighter text-6xl pt-2 lang-es">Estamos aquí para ti</h1>
      <h1 class="font-black tracking-tighter text-6xl pt-2 lang-en hidden">We're here for you</h1>
    </div>

    <div class="max-w-3xl mx-auto grid md:grid-cols-3 gap-5">
      <a href="https://wa.me/18323624499" class="block bg-[#0d1a2e] border border-[#1e3050] rounded-3xl p-8 text-center hover:border-[#3b82f6]">
        <div class="mx-auto w-14 h-14 flex items-center justify-center rounded-2xl bg-emerald-500/10 text-4xl mb-5">📱</div>
        <div class="font-semibold text-xl">WhatsApp</div>
        <div class="text-[#22c55e] mt-1 text-lg font-medium">+1 (832) 362-4499</div>
      </a>
      
      <div class="bg-[#0d1a2e] border border-[#1e3050] rounded-3xl p-8 text-center">
        <div class="mx-auto w-14 h-14 flex items-center justify-center rounded-2xl bg-[#2563eb]/10 text-4xl mb-5">✉️</div>
        <div class="font-semibold text-xl">Email</div>
        <a href="mailto:hola@mandarcasa.com" class="text-[#3b82f6] mt-1 block text-lg">hola@mandarcasa.com</a>
      </div>
      
      <div class="bg-[#0d1a2e] border border-[#1e3050] rounded-3xl p-8 text-center">
        <div class="mx-auto w-14 h-14 flex items-center justify-center rounded-2xl bg-amber-500/10 text-4xl mb-5">🕒</div>
        <div class="font-semibold text-xl">Disponibilidad</div>
        <div class="text-white/75 mt-1">Lunes a Sábado<br>7:00 am — 8:00 pm CST</div>
      </div>
    </div>
  </div>

  <script>
    function switchLanguage(lang) {
      const esBtn = document.getElementById('lang-es-btn'); const enBtn = document.getElementById('lang-en-btn');
      const esEls = document.querySelectorAll('.lang-es'); const enEls = document.querySelectorAll('.lang-en');
      if (lang === 'es') {
        esBtn.classList.add('bg-[#2563eb]','text-white'); esBtn.classList.remove('text-white/70');
        enBtn.classList.remove('bg-[#2563eb]','text-white'); enBtn.classList.add('text-white/70');
        esEls.forEach(el => el.classList.remove('hidden')); enEls.forEach(el => el.classList.add('hidden'));
        document.documentElement.lang = 'es'; localStorage.setItem('mandarcasa_lang','es');
      } else {
        enBtn.classList.add('bg-[#2563eb]','text-white'); enBtn.classList.remove('text-white/70');
        esBtn.classList.remove('bg-[#2563eb]','text-white'); esBtn.classList.add('text-white/70');
        esEls.forEach(el => el.classList.add('hidden')); enEls.forEach(el => el.classList.remove('hidden'));
        document.documentElement.lang = 'en'; localStorage.setItem('mandarcasa_lang','en');
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('mandarcasa_lang') || 'es';
      const esBtn = document.getElementById('lang-es-btn'); const enBtn = document.getElementById('lang-en-btn');
      if (saved === 'en') {
        enBtn.classList.add('bg-[#2563eb]','text-white');
        document.querySelectorAll('.lang-es').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.lang-en').forEach(el => el.classList.remove('hidden'));
        document.documentElement.lang = 'en';
      } else {
        esBtn.classList.add('bg-[#2563eb]','text-white');
      }
    });
  </script>
</body>
</html>
