<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — MandarCasa</title>
  <meta name="description" content="Contáctanos por WhatsApp, email o formulario. Estamos aquí para ayudarte a enviar lo que tu familia necesita.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}
  </script>
</head>
<body class="bg-[#07101f] text-white font-sans">

  <!-- NAV -->
  <nav class="sticky top-0 z-50 border-b border-[#1e3050] bg-[#07101f]/95 backdrop-blur">
    <div class="max-w-screen-xl px-6 mx-auto flex h-16 items-center justify-between">
      <a href="index.html" class="font-black tracking-tighter text-2xl">Mandar<span class="text-[#3b82f6]">Casa</span></a>
      <div class="hidden md:flex font-medium gap-8 text-sm">
        <a href="index.html">Inicio</a>
        <a href="como-funciona.html">Cómo Funciona</a>
        <a href="proveedores.html">Para Proveedores</a>
        <a href="contacto.html" class="text-[#3b82f6]">Contacto</a>
      </div>
      <a href="https://wa.me/18323624499" class="text-sm">💬 WhatsApp</a>
    </div>
  </nav>

  <div class="max-w-screen-xl mx-auto px-6 pt-16 pb-24">
    <div class="text-center max-w-md mx-auto mb-9">
      <div class="font-extrabold tracking-widest text-xs text-[#3b82f6]">HABLEMOS</div>
      <h1 class="font-black tracking-tighter text-6xl pt-2">Estamos aquí para ti</h1>
    </div>

    <!-- Contact options -->
    <div class="grid md:grid-cols-3 gap-5 max-w-3xl mx-auto">
      <div class="bg-[#0d1a2e] rounded-3xl p-8 border border-[#1e3050] text-center">
        <div class="mx-auto w-12 h-12 flex items-center justify-center rounded-2xl bg-emerald-500/10 text-3xl mb-5">📱</div>
        <div class="font-semibold">WhatsApp</div>
        <a href="https://wa.me/18323624499" class="text-emerald-400 block mt-px">+1 (832) 362-4499</a>
      </div>
      <div class="bg-[#0d1a2e] rounded-3xl p-8 border border-[#1e3050] text-center">
        <div class="mx-auto w-12 h-12 flex items-center justify-center rounded-2xl bg-[#2563eb]/10 text-3xl mb-5">✉️</div>
        <div class="font-semibold">Email</div>
        <a href="mailto:hola@mandarcasa.com" class="text-[#3b82f6] mt-px block">hola@mandarcasa.com</a>
      </div>
      <div class="bg-[#0d1a2e] rounded-3xl p-8 border border-[#1e3050] text-center">
        <div class="mx-auto w-12 h-12 flex items-center justify-center rounded-2xl bg-amber-500/10 text-3xl mb-5">🕒</div>
        <div class="font-semibold">Horario</div>
        <div class="text-sm text-white/75 mt-px">Lun–Sáb • 7am–8pm CST</div>
      </div>
    </div>

    <!-- Contact form -->
    <div class="max-w-lg mx-auto mt-14">
      <form id="contactForm" class="bg-[#0d1a2e] border border-[#1e3050] p-8 rounded-3xl space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-bold tracking-widest block mb-1.5">Nombre</label>
            <input required type="text" placeholder="Tu nombre" class="rounded-2xl bg-[#07101f] border border-[#334b6e] w-full py-3 px-4">
          </div>
          <div>
            <label class="text-xs font-bold tracking-widest block mb-1.5">WhatsApp / Teléfono</label>
            <input required type="tel" placeholder="+1 832-XXX-XXXX" class="rounded-2xl bg-[#07101f] border border-[#334b6e] w-full py-3 px-4">
          </div>
        </div>
        <div>
          <label class="block mb-1.5 text-xs font-bold tracking-widest">¿En qué podemos ayudarte?</label>
          <textarea rows="4" required class="rounded-2xl w-full border px-4 py-3 border-[#334b6e] bg-[#07101f]" placeholder="Cuéntanos más detalles..."></textarea>
        </div>
        <button class="w-full py-3.5 text-lg bg-[#2563eb] hover:bg-[#3b82f6] font-bold rounded-2xl">Enviar mensaje</button>
      </form>
      
      <div id="contactSuccess" hidden class="text-center mt-4 text-emerald-400 text-sm">¡Gracias! Te responderemos pronto.</div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
